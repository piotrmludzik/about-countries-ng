@if (componentState | async; as componentState) {
  <acn-countries-table [columns]="componentState.columns"
                       [data]="componentState.filteredCountries"
                       [dataLoading]="componentState.filteredCountriesLoading"
                       [sortField]="componentState.sortField"
                       (sortData)="onSortData($event)"/>
}
