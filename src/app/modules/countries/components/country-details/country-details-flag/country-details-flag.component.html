@if (loading) {
  <p-skeleton width="100%"
              height="100%"
              [style]="{'aspect-ratio': '3 / 2'}" />  <!-- TODO: change to class for Tailwind -->

} @else {
  <img [src]="flagUrl"
       alt="Flag of {{ countryName }}"
       pTooltip="Flag of {{ countryName }}"
       tooltipPosition="top"
       [showDelay]="tooltipDelay"
       class="border-1 border-gray-100"
       [ngClass]="{hidden: flagLoading}"
       (load)="flagLoading = false" />

  @if (flagLoading) {
    <p-skeleton width="100%"
                height="100%"
                [style]="{'aspect-ratio': '3 / 2'}" />  <!-- TODO: change to class for Tailwind -->
  }
}
