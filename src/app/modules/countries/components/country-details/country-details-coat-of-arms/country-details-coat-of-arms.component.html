@if (loading) {
  <p-skeleton width="100%"
              height="100%"
              [style]="{'aspect-ratio': '1'}" />  <!-- TODO: change to class for Tailwind -->

} @else {
  @if (coatOfArmsUrl) {
    <img [src]="coatOfArmsUrl"
         alt="Coat of arms of {{ countryName }}"
         pTooltip="Coat of arms of {{ countryName }}"
         [showDelay]="tooltipDelay"
         class="max-w-full"
         [ngClass]="{hidden: coatOfArmsLoading}"
         (load)="coatOfArmsLoading = false" />

    @if (coatOfArmsLoading) {
      <p-skeleton width="100%"
                  height="100%"
                  [style]="{'aspect-ratio': '1'}" />  <!-- TODO: change to class for Tailwind -->

    }
  }
}
