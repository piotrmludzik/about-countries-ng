@if (loading) {
  <div class="flex flex-column gap-3">
    <div *ngFor="let i of [].constructor(4)" class="flex gap-3">
      <p-skeleton width="8rem" />
      <p-skeleton class="flex-grow-1" />
    </div>
  </div>

} @else {
  <table class="flex-grow-1">
    <acn-table-details-row title="Start of week"
                           [data]="startOfWeek | emptyValue"
                           titleClass="w-8rem" />

    <acn-table-details-row title="Postal code format"
                           [data]="postalCode?.format | emptyValue"
                           titleClass="w-8rem" />

    <acn-table-details-row title="Traffic side"
                           [data]="carInfo?.side | emptyValue"
                           titleClass="w-8rem" />

    <acn-table-details-row title="License plates"
                           [data]="carInfo?.signs | stringList | emptyValue"
                           titleClass="w-8rem" />
  </table>
}
