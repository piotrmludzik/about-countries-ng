<div class="top-bar">
  @if (stats$ | async; as stats) {
    <div class="flex flex-column xl:flex-row row-gap-5 column-gap-1 p-3 md:px-5 md:py-3">
      <acn-layout-bar [stats]="stats" />

      <acn-layout-toolbox [menuItems]="layoutMenuConfig"
                          (continentsChange)="onContinentsChange($event)"
                          (searchChange)="onSearchChange($event)" />
    </div>
  }
</div>

<div class="p-3 md:px-5 md:py-3">
  <router-outlet />
</div>
